<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Background transparent -->
  
  <!-- Gear -->
  <g transform="translate(200, 180) scale(1.2)">
    <path d="M45.5,15.5 l10-5 l5,10 l15,2 l10-10 l12,6 l2,15 l10,5 l-5,10 l15,2 l10-10 l12,6 l2,15 l10,5 l-5,10 l15,2 l10-10 l12,6 l2,15" fill="none" stroke="#E67E22" stroke-width="8" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#E67E22" stroke-width="12" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#27AE60" stroke-width="4" />
    <!-- Center text JK -->
    <text x="-25" y="15" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#E67E22">J</text>
    <text x="5" y="15" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#27AE60">K</text>
  </g>

  <!-- Drill/Piling Machine -->
  <g transform="translate(200, 180) scale(1)">
    <rect x="-8" y="-120" width="16" height="180" fill="#2C3E50" />
    <polygon points="-15,60 15,60 0,100" fill="#7F8C8D" />
    <!-- Drill spiral -->
    <path d="M-12,70 Q 0,80 12,70" fill="none" stroke="#BDC3C7" stroke-width="3" />
    <path d="M-9,80 Q 0,90 9,80" fill="none" stroke="#BDC3C7" stroke-width="3" />
    <path d="M-6,90 Q 0,95 6,90" fill="none" stroke="#BDC3C7" stroke-width="3" />
    
    <!-- Top mechanism -->
    <rect x="-15" y="-130" width="30" height="20" fill="#E67E22" />
    <circle cx="0" cy="-140" r="10" fill="#7F8C8D" />
  </g>

  <!-- EST. 2008 -->
  <text x="250" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#A0522D">EST. 2008</text>
  
  <!-- J.K. PILE FOUNDATION & CONSTRUCTION -->
  <text x="200" y="320" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#E67E22" text-anchor="middle">J.K. PILE FOUNDATION &amp; CONSTRUCTION</text>
  
  <!-- CIVIL, PILING & MARINE CONTRACTOR -->
  <text x="200" y="350" font-family="Arial, sans-serif" font-size="16" fill="#27AE60" text-anchor="middle">CIVIL, PILING &amp; MARINE CONTRACTOR</text>
  
</svg>
